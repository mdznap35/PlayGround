name: CineForge CPU Renderer

on:
  push:
    branches:
      - main
      - feat/cineforge-studio-core
      - feat/cineforge-cinematic-media-v2
    paths:
      - "apps/cineforge-studio/jobs/*.json"
      - "apps/cineforge-studio/jobs/**/*.json"
      - "apps/cineforge-studio/render.py"
      - "apps/cineforge-studio/gpu_preflight.py"
      - "apps/cineforge-studio/app.js"
      - "apps/cineforge-studio/index.html"
      - "apps/cineforge-studio/captions.js"
      - "apps/cineforge-studio/styles.css"
      - "apps/cineforge-studio/story-plan-import.js"
      - "apps/cineforge-studio/story-planner.html"
      - "apps/cineforge-studio/story-planner.css"
      - "apps/cineforge-studio/story-planner.*"
      - "apps/cineforge-studio/tests/**"
      - ".github/workflows/cineforge-render.yml"
  pull_request:
    branches:
      - feat/cineforge-studio-core
    paths:
      - "apps/cineforge-studio/jobs/*.json"
      - "apps/cineforge-studio/jobs/**/*.json"
      - "apps/cineforge-studio/render.py"
      - "apps/cineforge-studio/gpu_preflight.py"
      - "apps/cineforge-studio/app.js"
      - "apps/cineforge-studio/index.html"
      - "apps/cineforge-studio/captions.js"
      - "apps/cineforge-studio/styles.css"
      - "apps/cineforge-studio/story-plan-import.js"
      - "apps/cineforge-studio/story-planner.html"
      - "apps/cineforge-studio/story-planner.css"
      - "apps/cineforge-studio/story-planner.*"
      - "apps/cineforge-studio/tests/**"
      - ".github/workflows/cineforge-render.yml"
  workflow_dispatch:
    inputs:
      job_file:
        description: "JSON file inside apps/cineforge-studio/jobs/"
        required: true
        default: "apps/cineforge-studio/jobs/demo.json"
        type: string

permissions:
  contents: read

concurrency:
  group: cineforge-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Validate and render MP4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/cineforge-studio/requirements.txt

      - name: Install system renderer and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/cineforge-studio/requirements.txt

      - name: Check browser JavaScript syntax
        run: |
          node --check apps/cineforge-studio/app.js
          node --check apps/cineforge-studio/project-engine.js
          node --check apps/cineforge-studio/project-storage.js
          node --check apps/cineforge-studio/timeline-math.js
          node --check apps/cineforge-studio/story-planner.js
          node --check apps/cineforge-studio/story-plan-import.js
          node --check apps/cineforge-studio/media-bin.js
          node --check apps/cineforge-studio/captions.js

      - name: Test story-plan importer
        run: node --test apps/cineforge-studio/tests/*.test.cjs

      - name: Run renderer validation tests
        run: python -m unittest discover -s apps/cineforge-studio/tests -v

      - name: Resolve job file
        id: job
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_JOB_FILE: ${{ inputs.job_file }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            JOB_FILE="$INPUT_JOB_FILE"
          else
            JOB_FILE="$(python - <<'PY'
          import json, os
          payload = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          candidates = []
          for commit in payload.get("commits", []):
              for key in ("added", "modified"):
                  candidates.extend(p for p in commit.get(key, []) if p.startswith("apps/cineforge-studio/jobs/") and p.endswith(".json"))
          valid_jobs = []
          for candidate in candidates:
              try:
                  document = json.load(open(candidate, encoding="utf-8"))
                  if isinstance(document, dict) and document.get("schema_version") == 1 and isinstance(document.get("scenes"), list):
                      valid_jobs.append(candidate)
              except (OSError, ValueError):
                  continue
          print(valid_jobs[-1] if valid_jobs else "")
          PY
          )"
            if [ -z "$JOB_FILE" ]; then JOB_FILE="apps/cineforge-studio/jobs/demo.json"; fi
          fi
          JOB_FILE="$(python - "$JOB_FILE" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("apps/cineforge-studio/jobs").resolve()
          candidate = pathlib.Path(sys.argv[1]).resolve()
          if root not in candidate.parents or candidate.suffix.lower() != ".json" or not candidate.is_file():
              raise SystemExit("Rejected job file: it must be an existing JSON file inside apps/cineforge-studio/jobs/")
          document = json.loads(candidate.read_text(encoding="utf-8"))
          if not isinstance(document, dict) or document.get("schema_version") != 1 or not isinstance(document.get("scenes"), list):
              raise SystemExit("Rejected job file: expected renderer schema_version 1 and a scenes array.")
          print(candidate.relative_to(pathlib.Path.cwd()))
          PY
          )"
          echo "file=$JOB_FILE" >> "$GITHUB_OUTPUT"
          echo "Selected job: $JOB_FILE"

      - name: Validate selected project
        run: python apps/cineforge-studio/render.py "${{ steps.job.outputs.file }}" --validate-only

      - name: Render MP4
        run: |
          mkdir -p dist
          python apps/cineforge-studio/render.py "${{ steps.job.outputs.file }}" --output dist/cineforge.mp4

      - name: Inspect MP4 streams and technical profile
        env:
          JOB_FILE: ${{ steps.job.outputs.file }}
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json dist/cineforge.mp4 > dist/ffprobe.json
          python - <<'PY'
          import json, os, pathlib
          probe=json.load(open("dist/ffprobe.json",encoding="utf-8"))
          job=json.load(open(os.environ["JOB_FILE"],encoding="utf-8"))
          video=next((s for s in probe.get("streams",[]) if s.get("codec_type")=="video"),None)
          if not video or video.get("codec_name")!="h264": raise SystemExit("Quality gate: H.264 video stream missing.")
          expected={"16:9":(1920,1080),"9:16":(1080,1920),"1:1":(1080,1080)}[job.get("aspect","16:9")]
          if (video.get("width"),video.get("height"))!=expected: raise SystemExit("Quality gate: unexpected video dimensions.")
          if video.get("r_frame_rate") not in ("24/1","25/1","30/1"): raise SystemExit("Quality gate: unexpected frame rate.")
          expected_duration=sum(int(s.get("seconds",8)) for s in job["scenes"])
          actual_duration=float(probe.get("format",{}).get("duration",0))
          if abs(actual_duration-expected_duration)>0.8: raise SystemExit("Quality gate: duration differs from the project timeline.")
          audio_expected=bool(job.get("audio_file") or job.get("voiceover_file") or job.get("music_file"))
          audio_found=any(s.get("codec_type")=="audio" for s in probe.get("streams",[]))
          if audio_expected and not audio_found: raise SystemExit("Quality gate: requested audio stream missing.")
          report={"project_title":job.get("title"),"expected_dimensions":expected,"expected_duration":expected_duration,
                  "actual_duration":actual_duration,"video":video,"audio_expected":audio_expected,
                  "audio_found":audio_found,"format":probe.get("format")}
          pathlib.Path("dist/render-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload video and QA report
        uses: actions/upload-artifact@v4
        with:
          name: cineforge-mp4-${{ github.run_number }}
          path: |
            dist/cineforge.mp4
            dist/render-report.json
            dist/ffprobe.json
          if-no-files-found: error
          retention-days: 7
