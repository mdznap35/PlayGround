name: CineForge CPU Renderer

on:
  push:
    branches:
      - main
      - feat/cineforge-studio-core
    paths:
      - "apps/cineforge-studio/jobs/*.json"
      - "apps/cineforge-studio/render.py"
      - ".github/workflows/cineforge-render.yml"
  workflow_dispatch:
    inputs:
      job_file:
        description: "JSON file inside apps/cineforge-studio/jobs/"
        required: true
        default: "apps/cineforge-studio/jobs/demo.json"
        type: string

permissions:
  contents: read

concurrency:
  group: cineforge-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Validate and render MP4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/cineforge-studio/requirements.txt

      - name: Install system renderer and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/cineforge-studio/requirements.txt

      - name: Run validation tests
        run: python -m unittest discover -s apps/cineforge-studio/tests -v

      - name: Resolve job file
        id: job
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_JOB_FILE: ${{ inputs.job_file }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            JOB_FILE="$INPUT_JOB_FILE"
          else
            JOB_FILE="$(git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA" -- 'apps/cineforge-studio/jobs/*.json' | head -n 1)"
          fi
          case "$JOB_FILE" in
            apps/cineforge-studio/jobs/*.json) ;;
            *) echo "Rejected job path: $JOB_FILE"; exit 1 ;;
          esac
          test -f "$JOB_FILE"
          echo "file=$JOB_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate selected project
        run: python apps/cineforge-studio/render.py "${{ steps.job.outputs.file }}" --validate-only

      - name: Render MP4
        run: |
          mkdir -p dist
          python apps/cineforge-studio/render.py "${{ steps.job.outputs.file }}" --output dist/cineforge.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: cineforge-mp4-${{ github.run_number }}
          path: dist/cineforge.mp4
          if-no-files-found: error
          retention-days: 7
